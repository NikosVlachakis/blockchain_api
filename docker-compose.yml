version: '3.8'

# YAML anchors for reusable service templates
x-blockchain-api-template: &blockchain-api-template
  build: .
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - dev

services:
  # OpenBao services for each organization - REMOVED

  # Blockchain API services for each organization
  blockchain-api-filestore:
    <<: *blockchain-api-template
    container_name: blockchain-api
    ports:
      - "3000:3000"
    environment:
      KEYSTORE_TYPE: "file"
      KEYSTORE_CONFIG: "{\"basePath\":\"/app/keystore_data\",\"salt\":\"\"}"
      KEYSTORE_PASSWORD: "master123"
      ORG_NAME: "bsc"
      MSP_ID: "BscMSP"
      PEER_ENDPOINT: "dns:///peer0.bsc.dt4h.com:8020"
      GATEWAY_PEER: "peer0.bsc.dt4h.com"
      FABRIC_CA_URL: "${TEST_FABRIC_CA_URL}"
      TLS_CA_URL: "${TEST_TLS_CA_URL}"
      FABRIC_CA_SKIP_TLS: "true"
      TLS_CA_SKIP_TLS: "true"
      AUTO_PROVISION_BUDGET: "${AUTO_PROVISION_BUDGET:-true}"
      BUDGET_ADMIN_ID: "${BUDGET_ADMIN_ID:-admin0}"
      BUDGET_ADMIN_SECRET: "${BUDGET_ADMIN_SECRET:-test123}"
      SEED_DATASETS: "${SEED_DATASETS:-test-dataset}"
      SEED_QUERY_COST: "${SEED_QUERY_COST:-0.1}"
      SEED_EPSILON: "${SEED_EPSILON:-10.0}"
      CHANNEL_ID: "${CHANNEL_ID:-dt4h}"
      CHAINCODE_ID: "${CHAINCODE_ID:-dt4hCC}"
      BSC_REG_USERNAME: "${BSC_REG_USERNAME}"
      BSC_REG_PASSWORD: "${BSC_REG_PASSWORD}"
      BSC_TEST_USER: "${BSC_TEST_USER}"
      BSC_TEST_PWD: "${BSC_TEST_PWD}"
      BLOCKCHAIN_API_URL: "http://localhost:3000"
    volumes:
      - type: bind
        source: ./identities
        target: /app/identities
        read_only: false
    profiles:
      - test-filestore
    
  orchestrator_service:
    build: ./orchestrator
    container_name: blockchain-api-orchestrator
    networks:
      - dev
    ports:
      - "7000:7000"
    profiles:
      - test-filestore
      - test-vault

  # Vault-backed Blockchain API service
  blockchain-api-vault:
    <<: *blockchain-api-template
    container_name: blockchain-api
    ports:
      - "3000:3000"
    environment:
      KEYSTORE_TYPE: "vault"
      KEYSTORE_CONFIG: '{"address":"http://vault:8200","token":"${VAULT_DEV_TOKEN:-dev-root-token}","mountPath":"secret","transitPath":"transit","transitKey":"blockchain-api-key"}'
      KEYSTORE_PASSWORD: ""
      ORG_NAME: "bsc"
      MSP_ID: "BscMSP"
      PEER_ENDPOINT: "dns:///peer0.bsc.dt4h.com:8020"
      GATEWAY_PEER: "peer0.bsc.dt4h.com"
      FABRIC_CA_URL: "${TEST_FABRIC_CA_URL}"
      TLS_CA_URL: "${TEST_TLS_CA_URL}"
      FABRIC_CA_SKIP_TLS: "true"
      TLS_CA_SKIP_TLS: "true"
      AUTO_PROVISION_BUDGET: "${AUTO_PROVISION_BUDGET:-true}"
      BUDGET_ADMIN_ID: "${BUDGET_ADMIN_ID:-admin0}"
      BUDGET_ADMIN_SECRET: "${BUDGET_ADMIN_SECRET:-test123}"
      SEED_DATASETS: "${SEED_DATASETS:-test-dataset}"
      SEED_QUERY_COST: "${SEED_QUERY_COST:-0.1}"
      SEED_EPSILON: "${SEED_EPSILON:-10.0}"
      CHANNEL_ID: "${CHANNEL_ID:-dt4h}"
      CHAINCODE_ID: "${CHAINCODE_ID:-dt4hCC}"
      BSC_REG_USERNAME: "${BSC_REG_USERNAME}"
      BSC_REG_PASSWORD: "${BSC_REG_PASSWORD}"
      BSC_TEST_USER: "${BSC_TEST_USER}"
      BSC_TEST_PWD: "${BSC_TEST_PWD}"
      BLOCKCHAIN_API_URL: "http://localhost:3000"
    volumes:
      - type: bind
        source: ./identities
        target: /app/identities
        read_only: false
    depends_on:
      - vault
    profiles:
      - test-vault

  # HashiCorp Vault service
  vault:
    image: hashicorp/vault:1.15
    container_name: blockchain-api-vault-server
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_TOKEN:-dev-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: info
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      # Note: config mount removed - not needed for dev mode, causes chown errors
    networks:
      - dev
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: server -dev
    profiles:
      - test-vault

  # NOTE: vault-init container removed - initialization is now done automatically
  # by the blockchain-api Go code in VaultKeystore.HealthCheck()

networks:
  dev:
    external: true
    name: fabric_dev
    driver: bridge

volumes:
  vault-data:
  vault-logs:
